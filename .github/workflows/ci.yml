name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ktlint, tests and builds for Android, desktop (JVM) and web. iOS needs macOS.
  android-desktop-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      # `check` runs ktlint, lint and every test. The two extra tasks build the debug APK
      # and the development web app. The slow optimised web bundle is left for publishing.
      - run: ./gradlew check :androidApp:assembleDebug :webApp:compileDevelopmentExecutableKotlinWasmJs

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      # The Kotlin/Native compiler and its precompiled library caches live outside ~/.gradle.
      - uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
      - run: ./gradlew :shared:iosSimulatorArm64Test
      - run: >
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp
          -configuration Debug -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build
