name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ktlint, tests and builds for Android, desktop (JVM) and web. iOS needs macOS.
  android-desktop-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      # `check` runs ktlint, lint and every test. The two extra tasks build the debug APK
      # and both browser variants used by the runtime smoke check.
      - run: ./gradlew check :androidApp:assembleDebug :webApp:wasmJsBrowserDistribution :webApp:jsBrowserDistribution
      - name: Smoke-test browser builds
        run: |
          smoke_dir=$(mktemp -d)
          npm install --prefix "$smoke_dir" --no-audit --no-fund playwright@1.65.1
          cp scripts/browser-smoke.mjs "$smoke_dir/"
          python3 -m http.server 8765 --bind 127.0.0.1 --directory webApp/build/dist &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          curl --silent --fail --retry 5 --retry-connrefused http://127.0.0.1:8765/ >/dev/null
          KOLAM_CHROME_PATH=$(command -v google-chrome) node "$smoke_dir/browser-smoke.mjs" \
            http://127.0.0.1:8765/wasmJs/productionExecutable/ http://127.0.0.1:8765/js/productionExecutable/

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      # The Kotlin/Native compiler and its precompiled library caches live outside ~/.gradle.
      - uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
      - run: ./gradlew :shared:iosSimulatorArm64Test
      - run: >
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp
          -configuration Debug -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build
